name: Auto Sync from Public Repo

on:
  schedule:
    - cron: '*/10 * * * *'  # ਹਰ 10 ਮਿੰਟ ਬਾਅਦ ਚੈੱਕ ਕਰੇਗਾ
  workflow_dispatch:      # ਤੁਸੀਂ ਮੈਨੂਅਲ ਵੀ ਚਲਾ ਸਕਦੇ ਹੋ

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout My Repository
        uses: actions/checkout@v4

      - name: Pull Files from Target Public Repo
        run: |
          # ਉਸ ਰਿਪੋਜ਼ਟਰੀ ਨੂੰ ਟੈਂਪਰੇਰੀ ਕਲੋਨ ਕਰਨਾ
          git clone --depth 1 https://github.com/Sflex0719/m3u.git temp_repo
          
          # ਸਾਰੀਆਂ ਫਾਈਲਾਂ ਕਾਪੀ ਕਰਨਾ, ਪਰ .git ਅਤੇ .github ਫੋਲਡਰ ਨੂੰ ਛੱਡ ਕੇ
          rsync -av --exclude='.git' --exclude='.github' temp_repo/ ./
          
          # ਟੈਂਪਰੇਰੀ ਫੋਲਡਰ ਨੂੰ ਡਿਲੀਟ ਕਰਨਾ
          rm -rf temp_repo

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "ਕੋਈ ਨਵਾਂ ਬਦਲਾਅ ਨਹੀਂ ਹੈ।"
          else
            git commit -m "Auto-sync update from source repo"
            git push
            echo "ਡਾਟਾ ਸਫਲਤਾਪੂਰਵਕ ਅੱਪਡੇਟ ਹੋ ਗਿਆ ਹੈ!"
          fi
